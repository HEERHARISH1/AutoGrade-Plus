version: '3.8'

services:
  autograde-plus:
    build: .
    container_name: autograde-plus
    ports:
      - "5000:5000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FLASK_ENV=production
    volumes:
      - ./data:/app/data
      - ./lora_model:/app/lora_model
    restart: unless-stopped
    networks:
      - autograde-network

networks:
  autograde-network:
    driver: bridge
